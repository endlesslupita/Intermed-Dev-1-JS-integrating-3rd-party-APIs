<html>
<head>
</head>

<body>
  <main>
    <input type="button" id="button1" value="Generate a startup idea" />
    <p id="display"></p>
  </main>

  <script>
    document.getElementById("button1").addEventListener("click", async function() {
      try {
        const response = await fetch("https://corsproxy.io/?http://itsthisforthat.com/api.php?json");
        const data = await response.json();
        document.getElementById("display").textContent = ("It's like " + data.this + " for " + data.that)
      } catch (error) {
        document.getElementById("display").textContent = ("Sorry, the VC money ran out.")
      }
    })
  </script>

</body>
</html>
